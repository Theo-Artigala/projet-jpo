<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackSchool - Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/desktop.css">
    <style>
        @keyframes windowOpen {
            from {
                opacity: 0;
                transform: scale(0.7);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes windowClose {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.7);
            }
        }
        
        .window-opening {
            animation: windowOpen 0.3s ease-out !important;
        }
        
        .window-closing {
            animation: windowClose 0.3s ease-out !important;
        }
    </style>
</head>
<body>
    <div id="desktop">
        <div id="desktop-area">
            <!-- Icônes Bureau -->
            <div class="desktop-icon" ondblclick="window.desktopUI?.openApplication('browser')">
                <img src="assets/icons/icon-browser.svg" alt="Navigateur" style="width: 48px; height: 48px;" />
                <div class="desktop-icon-label">Navigateur</div>
            </div>

            <div class="desktop-icon" ondblclick="window.desktopUI?.openApplication('explorer')">
                <img src="assets/icons/icon-files.svg" alt="Explorateur" style="width: 48px; height: 48px;" />
                <div class="desktop-icon-label">Explorateur</div>
            </div>

            <div class="desktop-icon" ondblclick="window.desktopUI?.openApplication('terminal')">
                <img src="assets/icons/icon-terminal.svg" alt="Terminal" style="width: 48px; height: 48px;" />
                <div class="desktop-icon-label">Terminal</div>
            </div>

            <div class="desktop-icon" ondblclick="window.desktopUI?.openApplication('mail')">
                <img src="assets/icons/icon-mail.svg" alt="Mail" style="width: 48px; height: 48px;" />
                <div class="desktop-icon-label">Mail</div>
            </div>

            <div class="desktop-icon" ondblclick="window.desktopUI?.openApplication('recycleBin')">
                <img src="assets/icons/icon-recycle.svg" alt="Corbeille" style="width: 48px; height: 48px;" />
                <div class="desktop-icon-label">Corbeille</div>
            </div>
        </div>
    </div>

    <!-- Script principal -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
