<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSINT-OS v5.1 — Level 2: Follow the Money</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Dynamic favicon -->
    <link id="dyn-favicon" rel="icon" href="" />

    <style>
      /* --- REUSED STYLES FROM LEVEL 1 (Optimized) --- */
      :root {
        /* Darker, more serious theme for Level 2 */
        --bg-wallpaper: url("https://images.unsplash.com/photo-1507697364665-69eec30ea71e?q=80&w=2071&auto=format&fit=crop");
        --color-dark: #0f172a;
        --color-dark-glass: rgba(10, 10, 15, 0.92);
        --color-light: #f8fafc;
        --color-accent: #8b5cf6; /* Purple accent for Lvl 2 */
        --color-accent-dim: rgba(139, 92, 246, 0.2);
        --color-danger: #ef4444;
        --color-warning: #f59e0b;
        --color-success: #10b981;
        --color-border: rgba(255, 255, 255, 0.1);
        --radius-win: 8px;
        --shadow-win: 0 25px 60px -12px rgba(0, 0, 0, 0.9);
        --blur-glass: blur(20px);
        --header-height: 36px;
      }

      * { box-sizing: border-box; user-select: none; outline: none; -webkit-font-smoothing: antialiased; cursor: default; }
      html, body { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: #000; font-family: Inter, sans-serif; color: var(--color-light); }
      button, a, .clickable, [data-action], .desktop-icon, .wc-btn, .dock-icon { cursor: pointer !important; }
      input, textarea { cursor: text !important; }
      .win-header { cursor: move !important; }
      .win-resize { cursor: nwse-resize !important; }
      
      /* CRT Effect */
      .crt-overlay {
        position: fixed; inset: 0; pointer-events: none; z-index: 9999;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        background-size: 100% 2px, 3px 100%;
        opacity: 0.3; pointer-events: none;
      }

      /* Utilities */
      .hidden { display: none !important; }
      .flex-center { display: flex; align-items: center; justify-content: center; }
      .full-size { width: 100%; height: 100%; }
      .font-mono { font-family: "JetBrains Mono", monospace; }
      .clickable:hover { cursor: pointer; filter: brightness(1.2); transform: scale(1.02); transition: 0.2s; }

      /* BOOT & LOGIN */
      #boot-layer { position: fixed; inset: 0; background: #000; z-index: 9999; padding: 40px; font-family: "Share Tech Mono", monospace; color: var(--color-accent); display: flex; flex-direction: column; justify-content: flex-end; font-size: 16px; }
      .boot-line { margin-bottom: 6px; opacity: 0; animation: fadeIn 0.1s forwards; border-left: 2px solid transparent; padding-left: 10px; }
      @keyframes fadeIn { to { opacity: 1; } }

      /* DESKTOP */
      #desktop { position: fixed; inset: 0; background: #1e293b var(--bg-wallpaper) center/cover; z-index: 1; overflow: hidden; }
      #status-bar { height: var(--header-height); background: rgba(5, 5, 10, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 13px; font-weight: 500; color: #cbd5e1; }
      .sb-group { display: flex; gap: 20px; align-items: center; }

      #icon-grid { position: absolute; top: 50px; left: 20px; bottom: 100px; right: 20px; display: grid; grid-template-columns: repeat(6, 100px); gap: 20px; align-content: start; }
      .desktop-icon { width: 90px; padding: 10px 5px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; text-align: center; color: #e2e8f0; text-shadow: 0 2px 4px rgba(0,0,0,0.8); position: relative; }
      .desktop-icon:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.1); backdrop-filter: blur(4px); }
      .di-img { font-size: 36px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); position: relative; }
      .di-label { font-size: 11px; font-weight: 600; line-height: 1.3; }

      /* WINDOWS */
      @keyframes windowFadeIn {
        from { opacity: 0; transform: scale(0.9) translateY(-20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes windowSlideIn {
        from { opacity: 0; transform: translateX(-100px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .window { position: absolute; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 1px rgba(0, 0, 0, 0.05); backdrop-filter: blur(20px); display: flex; flex-direction: column; overflow: hidden; opacity: 0; transform: scale(0.95); transition: opacity 0.2s, transform 0.2s; min-width: 300px; min-height: 200px; animation: windowFadeIn 0.3s ease-out forwards; }
      .window.open { opacity: 1; transform: scale(1); }
      .window.maximized { top: 35px !important; left: 0 !important; width: 100% !important; height: calc(100% - 35px) !important; transform: none !important; border-radius: 0; z-index: 9999 !important; }
      .win-resize { position: absolute; bottom: 0; right: 0; width: 20px; height: 20px; cursor: nwse-resize; z-index: 20; }
      .win-header { height: 40px; background: linear-gradient(180deg, rgba(246, 248, 250, 0.98) 0%, rgba(237, 242, 247, 0.98) 100%); border-bottom: 1px solid rgba(0, 0, 0, 0.06); display: flex; align-items: center; padding: 0 0 0 16px; cursor: move; user-select: none; justify-content: space-between; backdrop-filter: blur(40px); }
      .win-controls { display: flex; gap: 0; margin-left: auto; }
      .wc-btn { width: 48px; height: 40px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; position: relative; font-size: 11px; color: #5f6368; }
      .wc-btn:hover { background: rgba(0, 0, 0, 0.05); }
      .wc-close:hover { background: #e81123 !important; color: white; }
      .wc-close::before { content: '✕'; font-size: 13px; font-weight: 400; }
      .wc-max::before { content: ''; width: 11px; height: 11px; border: 1.5px solid currentColor; border-radius: 1px; }
      .window.maximized .wc-max::before { content: ''; width: 10px; height: 10px; border: 1.5px solid currentColor; position: relative; top: 2px; left: 2px; }
      .window.maximized .wc-max::after { content: ''; position: absolute; width: 10px; height: 10px; border: 1.5px solid currentColor; border-bottom: none; border-right: none; top: 11px; left: 17px; background: rgba(237, 242, 247, 0.98); }
      .win-title { font-size: 13px; font-weight: 500; color: #202124; flex: 1; pointer-events: none; letter-spacing: 0.2px; }
      .win-content { flex: 1; position: relative; overflow: hidden; background: white; color: #202124; }

      /* MISSION HUD */
      #mission-hud { position: absolute; top: 50px; right: 20px; width: 380px; background: rgba(10, 10, 15, 0.85); border: 1px solid var(--color-border); border-radius: 8px; padding: 15px; z-index: 50; backdrop-filter: blur(15px); transform: translateX(120%); transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
      #mission-hud.active { transform: translateX(0); }
      .hud-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
      .hud-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--color-accent); font-weight: 800; }
      #mission-brief { font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 10px; }
      
      /* TOAST */
      #toast-area { position: fixed; top: 280px; right: 10px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
      .toast { pointer-events: auto; background: rgba(20, 20, 20, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-left: 4px solid var(--color-accent); padding: 14px; border-radius: 6px; width: 340px; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideIn 0.3s ease-out; }
      @keyframes slideIn { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

      /* APPS SPECIFIC */
      .app-explorer { padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; align-content: start; height: 100%; overflow-y: auto; }
      .file-item { display: flex; flex-direction: column; align-items: center; padding: 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; text-align: center; width: 100%; }
      .file-item:hover { background: rgba(255,255,255,0.05); }
      .file-icon { font-size: 32px; margin-bottom: 5px; flex-shrink: 0; }
      .file-name { font-size: 11px; word-wrap: break-word; word-break: break-word; overflow-wrap: break-word; max-width: 100%; line-height: 1.3; white-space: normal; hyphens: auto; }

      /* MAIL APP (LIGHT THEME) */
      .app-mail { display: flex; height: 100%; background: #fff; color: #1e293b; font-family: "Segoe UI", sans-serif; }
      .m-sb { width: 220px; background: #f1f5f9; padding: 10px; border-right: 1px solid #cbd5e1; }
      .m-folder { padding: 8px 12px; font-size: 13px; border-radius: 6px; cursor: pointer; color: #64748b; margin-bottom: 2px; display: flex; justify-content: space-between; }
      .m-folder:hover { background: #e2e8f0; color: #0f172a; }
      .m-folder.active { background: #dbeafe; color: #2563eb; font-weight: 700; }
      .m-list { width: 360px; border-right: 1px solid #cbd5e1; overflow-y: auto; background: white; }
      .m-item { padding: 15px; border-bottom: 1px solid #f1f5f9; cursor: pointer; position: relative; }
      .m-item:hover { background: #f8fafc; }
      .m-item.unread { background: #eff6ff; }
      .m-item.unread::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #2563eb; }
      .m-view { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; }
      .m-h-sub { font-size: 20px; font-weight: 800; margin-bottom: 15px; }
      .m-h-meta { display: flex; justify-content: space-between; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; color: #64748b; font-size: 13px; }
      .m-body { line-height: 1.6; font-size: 15px; color: #334155; }

      .app-chat { display: flex; height: 100%; background: #1e1e1e; color: #eee; font-family: 'Segoe UI', sans-serif; }
      .chat-sidebar { width: 200px; background: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; }
      .chat-list { flex: 1; overflow-y: auto; }
      .chat-contact { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; display: flex; align-items: center; gap: 10px; }
      .chat-contact:hover { background: #2a2d2e; }
      .chat-contact.active { background: #37373d; }
      .chat-avatar { width: 32px; height: 32px; border-radius: 50%; background: #555; display: flex; align-items: center; justify-content: center; font-size: 14px; }
      .chat-main { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; }
      .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.4; }
      .msg.in { background: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
      .msg.out { background: var(--color-accent); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
      .chat-lock-screen { position: absolute; inset: 0; background: rgba(30,30,30,0.95); backdrop-filter: blur(5px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }

      .app-browser { display: flex; flex-direction: column; height: 100%; background: #fff; color: #333; }
      .b-bar { padding: 8px; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; display: flex; gap: 10px; }
      .b-input { flex: 1; padding: 6px 12px; border-radius: 4px; border: 1px solid #cbd5e1; font-size: 13px; color: #475569; background: white; }
      .b-content { flex: 1; overflow-y: auto; position: relative; }

      /* DOCK */
      #dock-container { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; z-index: 1000; }
      #dock { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 20px; display: flex; gap: 12px; }
      .dock-app { width: 50px; height: 50px; border-radius: 12px; font-size: 28px; background: rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; position: relative; border: 1px solid rgba(255, 255, 255, 0.05); }
      .dock-app:hover { transform: translateY(-10px) scale(1.1); background: rgba(255, 255, 255, 0.15); }
      .dock-app.running::after { content: ""; position: absolute; bottom: -6px; width: 4px; height: 4px; background: var(--color-accent); border-radius: 50%; }

      /* TERMINAL */
      .app-term { background: #0c0c0c; color: #ccc; font-family: "JetBrains Mono", monospace; padding: 15px; height: 100%; overflow-y: auto; font-size: 13px; }
      .term-line { margin-bottom: 4px; word-break: break-all; }
      .term-prompt { color: var(--color-success); margin-right: 8px; }
      .term-input { background: transparent; border: none; color: white; font-family: inherit; font-size: inherit; width: 100%; outline: none; }

      /* DANGER OVERLAY */
      #danger-overlay { position: fixed; inset: 0; z-index: 20000; background: rgba(50, 0, 0, 0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
      .danger-active { animation: flashRed 0.5s infinite; }
      @keyframes flashRed { 0% { background: rgba(255,0,0,0.2); } 50% { background: rgba(255,0,0,0.5); } 100% { background: rgba(255,0,0,0.2); } }
      .danger-text { font-size: 120px; color: #ef4444; font-weight: 900; font-family: 'Share Tech Mono'; text-shadow: 0 0 30px red; letter-spacing: 10px; animation: shake 0.2s infinite; display: none; }
      @keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(5px, -5px); } 50% { transform: translate(-5px, 5px); } 75% { transform: translate(5px, 5px); } 100% { transform: translate(0,0); } }
      .antivirus-msg { font-family: 'Share Tech Mono'; color: #10b981; font-size: 24px; margin-top: 20px; text-shadow: 0 0 10px #10b981; display: none; }
      
      /* TERMINAL SPECIFIC */
      .term-window { background: #0c0c0c; color: #0f0; font-family: 'JetBrains Mono', monospace; padding: 15px; height: 100%; overflow-y: auto; font-size: 14px; display: flex; flex-direction: column; }
      .term-output { flex: 1; display: flex; flex-direction: column; gap: 4px; }
      .term-line { word-break: break-all; }
      .term-input-area { display: flex; margin-top: 10px; align-items: center; }
      .term-prompt { color: #10b981; margin-right: 10px; font-weight: bold; }
      .term-input { background: transparent; border: none; color: #fff; flex: 1; outline: none; font-family: inherit; font-size: inherit; }
      .term-progress { width: 100%; background: #333; height: 10px; margin-top: 5px; display: none; }
      .term-bar { height: 100%; background: #10b981; width: 0%; transition: width 0.2s; }

      /* PHOTO VIEWER (from Lvl 1, adapted) */
      .app-photos {
        display: flex;
        height: 100%;
        background: #111;
        color: #eee;
      }
      .p-canvas {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        background: radial-gradient(#222 1px, transparent 1px);
        background-size: 30px 30px;
      }
      .p-sidebar {
        width: 300px;
        background: #1a1a1a;
        border-left: 1px solid #333;
        padding: 20px;
        font-size: 12px;
        display: flex;
        flex-direction: column;
      }
      .p-meta-row { margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; }
      .p-meta-lbl { color: #666; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; display: block; font-size: 10px; }
      .btn-scan {
        margin-top: auto; width: 100%; padding: 12px;
        background: linear-gradient(135deg, var(--color-accent), #a78bfa);
        border: none; color: white; font-weight: 900; cursor: pointer; border-radius: 10px;
      }
      .btn-scan[disabled] { opacity: 0.5; cursor: wait; }
      
      /* NEW: Image Thumbnails & Loading Effect */
      .file-thumb { width: 100%; height: 60px; object-fit: cover; border-radius: 4px; margin-bottom: 5px; background: #222; }
      .img-scan-load {
        clip-path: inset(0 0 100% 0);
        animation: scanLoad 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes scanLoad { to { clip-path: inset(0 0 0 0); } }
      .scan-progress { width: 100%; height: 6px; background: #333; margin-top: 10px; border-radius: 3px; overflow: hidden; display: none; }
      .scan-bar { width: 0%; height: 100%; background: var(--color-success); transition: width 2s ease-in-out; }
      
      .flash-active::after {
        content: ""; position: fixed; inset: 0; background: red; opacity: 0;
        animation: flashRed 0.1s infinite; pointer-events: none; z-index: 99999;
      }
      @keyframes flashRed { 0% { opacity: 0; } 50% { opacity: 0.3; } 100% { opacity: 0; } }
      @keyframes blink { 50% { opacity: 0; } }

    </style>
  </head>

  <body>
    <div class="crt-overlay"></div>
    
    <!-- BOOT SEQUENCE -->
    <div id="boot-layer">
      <div id="boot-log"></div>
    </div>

    <!-- GAME OVER / WIN SCREENS -->
    <div id="end-screen" class="hidden" style="position: fixed; inset: 0; z-index: 10000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Share Tech Mono', monospace; text-align: center;">
       <h1 id="end-title" style="font-size: 48px; margin-bottom: 20px;"></h1>
       <p id="end-msg" style="color: white; font-size: 18px; max-width: 600px; line-height: 1.5;"></p>
       <button onclick="window.location.href = window.location.pathname + '?skipBoot=true'" style="margin-top: 30px; background: transparent; border: 1px solid white; color: white; padding: 10px 20px; cursor: pointer; font-family: inherit;">RESTART SYSTEM</button>
    </div>

    
    <div id="toast-area"></div>

    <!-- DANGER OVERLAY -->
    <div id="danger-overlay" class="hidden">
      <div class="danger-text">DANGER</div>
      <div class="antivirus-msg">MENACE DÉTECTÉE... NEUTRALISATION EN COURS</div>
    </div>

    <!-- DESKTOP -->
    <div id="desktop" class="hidden">
      <div id="status-bar">
        <div class="sb-group">
          <span style="font-weight: 900; color: var(--color-accent);"> OSINT-OS v5.1</span>
          <span>Fichier</span>
          <span>Édition</span>
          <span>Outils</span>
        </div>
        <div class="sb-group">
          <span id="game-timer" style="color: var(--color-warning); font-weight: bold; font-family: 'Share Tech Mono'; font-size: 16px;">30:00</span>
          <span style="opacity: 0.5;">|</span>
          <span>📶 Connected (VPN)</span>
          <span id="clock" class="font-mono">00:00</span>
        </div>
      </div>

      <div id="mission-hud">
        <div class="hud-header">
          <span class="hud-title">Mission : Flux Financier</span>
          <button id="btn-toggle-hints" style="background:none; border:1px solid #64748b; color:#94a3b8; font-size:10px; cursor:pointer; border-radius:4px; padding:2px 6px;">Aide</button>
        </div>
        <div id="hint-selector" style="display:flex; gap:5px; margin-top:10px;">
          <button data-action="get-hint" data-level="1" style="flex:1; background:rgba(139,92,246,0.1); border:1px solid var(--color-accent); color:var(--color-accent); font-size:10px; cursor:pointer; border-radius:4px; padding:4px;">Indice 1</button>
          <button data-action="get-hint" data-level="2" style="flex:1; background:rgba(139,92,246,0.1); border:1px solid var(--color-accent); color:var(--color-accent); font-size:10px; cursor:pointer; border-radius:4px; padding:4px;">Indice 2</button>
          <button data-action="get-hint" data-level="3" style="flex:1; background:rgba(239,68,68,0.1); border:1px solid var(--color-danger); color:var(--color-danger); font-size:10px; cursor:pointer; border-radius:4px; padding:4px;">Solution</button>
        </div>
        <div id="mission-brief">
          Initialisation...
        </div>
      </div>

      <div id="icon-grid"></div>
      <div id="windows-area"></div>

      <div id="dock-container">
        <div id="dock"></div>
      </div>
    </div>

    <script>
      (function() {
        'use strict';
        
        // jQuery utilities avec cache et optimisations
        const DOM_CACHE = {};
        const $ = (selector) => {
          if (!DOM_CACHE[selector]) {
            DOM_CACHE[selector] = jQuery(selector);
          }
          return DOM_CACHE[selector];
        };
        
        const clearCache = (selector) => {
          if (selector) {
            delete DOM_CACHE[selector];
          } else {
            Object.keys(DOM_CACHE).forEach(key => delete DOM_CACHE[key]);
          }
        };
        
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        const escapeHtml = (s) => {
          if (!s) return '';
          return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        };
        const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
        
        // Gestion centralisée des intervalles
        const INTERVALS = {
          timer: null,
          clock: null,
          clear(name) {
            if (this[name]) {
              clearInterval(this[name]);
              this[name] = null;
            }
          },
          clearAll() {
            Object.keys(this).forEach(key => {
              if (typeof this[key] === 'number') {
                clearInterval(this[key]);
                this[key] = null;
              }
            });
          }
        };

        // -------------------------------------------------------
        // MODE DEBUG - Mettre DEBUG = true pour afficher toutes les solutions
        // -------------------------------------------------------
        const DEBUG = true; // ⚠️ CHANGER À true POUR ACTIVER LE MODE DEBUG

        // -------------------------------------------------------
        // MODE ADMIN - SOLUTIONS
        // -------------------------------------------------------
        const ADMIN_MODE = {

                  return `
                    <div class="p-meta-row">
                      <span class="p-meta-lbl" style="color:#888;">${escapeHtml(label)}</span>
                      <span style="${style}">${escapeHtml(valueStr)}</span>
                    </div>`;
                }).join('');

                $metaContainer.html(newContent).show();
                $metaContainer[0].scrollIntoView({ behavior: "smooth" });
                $progressContainer.hide();
                
                if (hasInterestingData) {
                  $el.text("✅ DONNÉES TROUVÉES").css('background', '#10b981');
                  Toast.show("Analyse Réussie", "Informations importantes détectées !", "success");
                } else {
                  $el.text("❌ AUCUNE DONNÉE").css('background', '#64748b');
                }
              }, 1500);
            }
          };

          if (handlers[action]) {
            try {
              handlers[action]();
            } catch(e) {
              console.error(`Erreur action ${action}:`, e);
            }
          }
        });

        // Gestion des boutons de contrôle des fenêtres
        jQuery(document).on('click', '[data-close]', function(e) {
          e.stopPropagation();
          WindowManager.close(jQuery(this).data('close'));
        });

        jQuery(document).on('click', '[data-maximize]', function(e) {
          e.stopPropagation();
          WindowManager.toggleMaximize(jQuery(this).data('maximize'));
        });

        jQuery(document).on('mousedown', '[data-drag]', function(e) {
          WindowManager.dragStart(e.originalEvent, jQuery(this).data('drag'));
        });

        jQuery(document).on('mousedown', '[data-resize]', function(e) {
          WindowManager.resizeStart(e.originalEvent, jQuery(this).data('resize'));
        });

        // Focus window on mousedown
        jQuery(document).on('mousedown', '.window', function() {
          const id = jQuery(this).attr('id').replace('win-', '');
          WindowManager.focus(id);
        });

        // Toggle hints
        jQuery(document).on('click', '#btn-toggle-hints', function() {
          jQuery("#mission-brief, #hint-selector").toggleClass("hidden");
        });

        // Gestion Alt+Tab pour switcher entre les fenêtres du jeu
        let altPressed = false;
        jQuery(document).on('keydown', function(e) {
          // Détecter Alt
          if (e.key === 'Alt') {
            altPressed = true;
          }
          
          // Détecter Alt+Tab
          if (altPressed && e.key === 'Tab') {
            e.preventDefault();
            e.stopPropagation();
            
            // Récupérer toutes les fenêtres ouvertes triées par zIndex
            const windows = jQuery('.window.open').toArray()
              .map(w => ({ el: w, z: parseInt(jQuery(w).css('zIndex')) || 0 }))
              .sort((a, b) => b.z - a.z);
            
            if (windows.length > 1) {
              // Prendre la fenêtre en haut et la mettre derrière
              const topWindow = windows[0];
              const newZ = windows[windows.length - 1].z - 1;
              jQuery(topWindow.el).css('zIndex', newZ);
              
              // Focus la deuxième fenêtre
              const secondWindow = windows[1];
              const winId = jQuery(secondWindow.el).attr('id').replace('win-', '');
              WindowManager.focus(winId);
              
              Toast.show("📎 Fenêtres", "Alt+Tab - Changement de fenêtre", "info");
            }
            
            return false;
          }
        });
        
        jQuery(document).on('keyup', function(e) {
          if (e.key === 'Alt') {
            altPressed = false;
          }
        });

        // Init
        jQuery(document).ready(() => OS.boot());

      })();
    </script>
  </body>
</html>
