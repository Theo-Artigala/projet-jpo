          create(id, title, content, w = 600, h = 400) {
            const existing = document.getElementById(`win-${id}`);
            if (existing) return this.focus(id);

            const win = document.createElement("div");
            win.id = `win-${id}`;
            win.className = "window open";
            
            const left = clamp((window.innerWidth - w) / 2 + (Math.random() * 40 - 20), 10, window.innerWidth - w - 10);
            const top = clamp((window.innerHeight - h) / 2 + (Math.random() * 40 - 20), 50, window.innerHeight - h - 90);

            Object.assign(win.style, {
              width: `${w}px`, height: `${h}px`, left: `${left}px`, top: `${top}px`, zIndex: ++zIndex
            });

            win.innerHTML = `
              <div class="win-header" data-drag="${id}">
                <div class="win-controls">
                  <div class="wc-btn wc-close" data-close="${id}"></div>
                  <div class="wc-btn wc-min"></div>
                  <div class="wc-btn wc-max"></div>
                </div>
                <div class="win-title">${escapeHtml(title)}</div>
              </div>
              <div class="win-content">${content}</div>
            `;
            
            $("#windows-area").appendChild(win);
            win.addEventListener("mousedown", () => this.focus(id));
            
            // Dock animation
            const dockItem = document.querySelector(`.dock-app[data-app="${id.split('-')[0]}"]`);
            if(dockItem) dockItem.classList.add("running");

            // Event listeners for controls
            win.querySelector(`[data-close="${id}"]`).addEventListener("click", (e) => { e.stopPropagation(); this.close(id); });
            win.querySelector(`[data-drag="${id}"]`).addEventListener("mousedown", (e) => this.dragStart(e, id));
          },

          close(id) {
            const win = document.getElementById(`win-${id}`);
            if(win) {
              win.classList.remove("open");
              setTimeout(() => {
                win.remove();
                const appType = id.split('-')[0];
                if (!document.querySelector(`.window[id^="win-${appType}"]`)) {
                  const dockItem = document.querySelector(`.dock-app[data-app="${appType}"]`);
                  if(dockItem) dockItem.classList.remove("running");
                }
              }, 200);
            }
          },

          focus(id) {
            const win = document.getElementById(`win-${id}`);
            if(win) win.style.zIndex = ++zIndex;
          },

          dragStart(e, id) {
            if(e.target.classList.contains('wc-btn')) return;
            const win = document.getElementById(`win-${id}`);
            this.focus(id);
            const rect = win.getBoundingClientRect();
            const offX = e.clientX - rect.left;
            const offY = e.clientY - rect.top;

            const move = (ev) => {
              const x = clamp(ev.clientX - offX, 0, window.innerWidth - 50);
              const y = clamp(ev.clientY - offY, 0, window.innerHeight - 50);
              win.style.left = x + "px";
              win.style.top = y + "px";
            };
            const up = () => {
              document.removeEventListener("mousemove", move);
              document.removeEventListener("mouseup", up);
            };
            document.addEventListener("mousemove", move);
            document.addEventListener("mouseup", up);
          }
        };

          Terminal: {
    history: [],
    historyIndex: 0,
    open() {
      const html = `
        <div class="app-term" id="term-app" onclick="document.getElementById('term-input').focus()">
          <div class="term-line">OSINT-OS Terminal // Session Julien</div>
          <div class="term-line">Tapez 'help' pour la liste des commandes.</div>
          <div id="term-output"></div>
          <div class="term-input-area">
            <span class="term-prompt">$</span>
            <input id="term-input" class="term-input" autocomplete="off" />
          </div>
        </div>
      `;
      WindowManager.create("term-main", "Terminal", html, 650, 420);
      setTimeout(() => {
        const input = document.getElementById("term-input");
        if (input) {
          input.focus();
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              const cmd = input.value;
              Apps.Terminal.history.push(cmd);
              Apps.Terminal.historyIndex = Apps.Terminal.history.length;
              Apps.Terminal.print("$ " + cmd);
              Apps.Terminal.handleCommand(cmd);
              input.value = "";
              // Scroll auto
              const app = document.getElementById("term-app");
              if(app) app.scrollTop = app.scrollHeight;
            } else if (e.key === "ArrowUp") {
              e.preventDefault();
              if (Apps.Terminal.history.length > 0) {
                Apps.Terminal.historyIndex = Math.max(0, Apps.Terminal.historyIndex - 1);
                input.value = Apps.Terminal.history[Apps.Terminal.historyIndex];
              }
            } else if (e.key === "ArrowDown") {
              e.preventDefault();
              if (Apps.Terminal.historyIndex < Apps.Terminal.history.length) {
                Apps.Terminal.historyIndex++;
                input.value = Apps.Terminal.history[Apps.Terminal.historyIndex] || "";
              }
            }
          });
        }
      }, 100);
    },

    print(line) {
      const out = document.getElementById("term-output");
      if (!out) return;
      const div = document.createElement("div");
      div.className = "term-line";
      div.textContent = line;
      out.appendChild(div);
    },

    handleCommand(raw) {
      const cmd = raw.trim();
      if (!cmd) return;

      // Command Registry
      const commands = {
        help: () => this.print("Commandes : help, ls, cat [fichier], netscan, connect [ip], pass [mdp], sort [dossier], decrypt [fichier]"),
        
        netscan: () => {
          this.print("Scan du réseau local en cours...");
          this.print("192.168.1.1    [ROUTER]");
          this.print("192.168.1.10   [WORKSTATION-JULIEN]");
          this.print("192.168.1.55   [SECURE-NAS]");
          STATE.flags.nasDiscovered = true;
        },

        sort: (args) => {
          const target = args[0];
          if (target === "Photos_Vacances") {
            this.print("Analyse du dossier 'Photos_Vacances'...");
            this.print("Tri par date en cours...");
            setTimeout(() => {
              this.print("Succès. Dossier 'Mariage_Trie' créé.");
              STATE.flags.photos_sorted = true;
              FILES.push({ id: "f_sorted", name: "Mariage_Trie", type: "folder" });
              if(document.getElementById('win-explorer')) { WindowManager.close('explorer'); Apps.Explorer.open(); }
            }, 1500);
          } else {
            this.print("Erreur : Dossier introuvable ou nom incorrect.");
          }
        },

        connect: (args) => {
          if (args[0] === "192.168.1.55") {
            if (!STATE.flags.nasDiscovered) return this.print("Erreur : cible introuvable. Lancez d'abord 'netscan'.");
            this.print("Connexion à 192.168.1.55...");
            this.print("Mot de passe requis. Utilisez 'pass <motdepasse>'.");
          } else {
            this.print("Hôte inconnu.");
          }
        },

        pass: (args) => {
          const pwd = args.join(" ");
          if (pwd === TARGET.nasPass) {
            this.print("Authentification réussie. Accès NAS accordé.");
            STATE.flags.nasConnected = true;
          } else {
            this.print("Mot de passe incorrect.");
          }
        },

        ls: () => {
          if (!STATE.flags.nasConnected) return this.print("Permission refusée. Connectez-vous d'abord.");
          this.print("iban_secours.txt");
          this.print("backups/");
        },

        cat: (args) => {
          if (args[0] === "iban_secours.txt") {
            if (!STATE.flags.nasConnected) return this.print("Permission refusée. Connectez-vous d'abord.");
            this.print(TARGET.safeIBAN);
            STATE.flags.ibanFound = true;
          } else {
            this.print("Fichier introuvable.");
          }
        },

        decrypt: (args) => {
          if (args[0] === "secure_notes.dat") {
            this.print("Déchiffrement en cours...");
            setTimeout(() => {
              this.print("Succès. Contenu déchiffré :");
              this.print(">> MÉMO : Le mot de passe de l'archive est une date importante. J'ai gardé une photo de ce jour-là.");
            }, 1500);
          } else {
            this.print("Erreur : Fichier introuvable ou non chiffré.");
          }
        }
      };

      const [baseCmd, ...args] = cmd.split(" ");
      if (commands[baseCmd]) {
        commands[baseCmd](args);
      } else {
        this.print("Commande inconnue. Tapez 'help'.");
      }
    },
  },
        };

        // -------------------------------------------------------
        // OS CORE
        // -------------------------------------------------------
        const OS = {
          async boot() {
            const log = $("#boot-log");
            const lines = [
              "LOADING KERNEL v5.1...",
              "MOUNTING VOLUMES... ENCRYPTED",
              "BYPASSING SECURITY... SUCCESS",
              "STARTING UI..."
            ];
            for (const line of lines) {
              const div = document.createElement("div");
              div.className = "boot-line";
              div.textContent = "> " + line;
              log.appendChild(div);
              await sleep(400);
            }
            await sleep(500);
            $("#boot-layer").classList.add("hidden");
            $("#desktop").classList.remove("hidden");
            OS.startTimer();
            OS.initDesktop();
            
            // Event: Chat notification after 2 mins
            setTimeout(() => {
              Toast.show("Message", "Nouveau message de 'Sophie'", "info");
            }, 120000);
          },

          triggerVirus() {
             const overlay = $("#danger-overlay");
             const txt = overlay.querySelector(".danger-text");
             const msg = overlay.querySelector(".antivirus-msg");
             
             overlay.classList.remove("hidden");
             overlay.classList.add("danger-active");
             txt.style.display = "block";
             
             setTimeout(() => {
               txt.style.display = "none";
               msg.style.display = "block";
               overlay.classList.remove("danger-active");
             }, 3000);

             setTimeout(() => {
               overlay.classList.add("hidden");
               msg.style.display = "none";
               Toast.show("Antivirus", "Menace 'bitcoin_wallet.exe' supprimée.", "success");
             }, 5500);
          },

          initDesktop() {
            const icons = [
              { name: "Fichiers", icon: "📂", action: "explorer" },
              { name: "Mail", icon: "📧", action: "mail" },
              { name: "SyncMobile", icon: "📱", action: "chat" },
              { name: "Navigateur", icon: "🌐", action: "browser" },
              { name: "Terminal", icon: "💻", action: "terminal" },
              { name: "A Faire", icon: "📝", action: "note" },
            ];

            $("#icon-grid").innerHTML = icons.map(i => `
              <div class="desktop-icon" data-action="launch" data-app="${i.action}">
                <div class="di-img">${i.icon}</div>
                <div class="di-label">${i.name}</div>
              </div>
            `).join('');

            $("#dock").innerHTML = icons.map(i => `
              <div class="dock-app" data-app="${i.action}" data-action="launch">${i.icon}</div>
            `).join('');

            setTimeout(() => $("#mission-hud").classList.add("active"), 1000);
            Story.updateBrief();
          },

          startTimer() {
            const timerEl = $("#game-timer");
            STATE.flags.timerInterval = setInterval(() => {
              STATE.flags.timeLeft--;
              const m = Math.floor(STATE.flags.timeLeft / 60);
              const s = STATE.flags.timeLeft % 60;
              timerEl.textContent = `${m}:${s.toString().padStart(2,'0')}`;
              
              if(STATE.flags.timeLeft <= 0) OS.gameOver();
            }, 1000);
            
            setInterval(() => {
              const now = new Date();
              $("#clock").textContent = now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
            }, 1000);
          },

          gameOver() {
            clearInterval(STATE.flags.timerInterval);
            $("#desktop").classList.add("hidden");
            $("#end-screen").classList.remove("hidden");
            $("#end-title").textContent = "ÉCHEC DE LA MISSION";
            $("#end-title").style.color = "#ef4444";
            $("#end-msg").textContent = "Le temps est écoulé. La connexion a été tracée et coupée par les services de sécurité.";
          },

          win() {
            clearInterval(STATE.flags.timerInterval);
            $("#desktop").classList.add("hidden");
            $("#end-screen").classList.remove("hidden");
            $("#end-title").textContent = "MISSION ACCOMPLIE";
            $("#end-title").style.color = "#10b981";
            $("#end-msg").textContent = "Virement effectué avec succès. Les fonds sont sécurisés.";

            const nextBtn = $("#next-level-btn");
            nextBtn.classList.remove("hidden");
            // Pour votre niveau 1, vous changerez 'niveau_3.html' en 'niveau_2.html'
            nextBtn.onclick = () => { window.location.href = 'niveau_3.html'; };
          }
        };

        // -------------------------------------------------------
        // GLOBAL HELPERS
        // -------------------------------------------------------
        const Toast = {
          show(title, msg, type="info") {
            const area = $("#toast-area");
            const t = document.createElement("div");
            t.className = "toast";
            t.style.borderLeftColor = type === 'error' ? '#ef4444' : type === 'success' ? '#10b981' : '#8b5cf6';
            t.innerHTML = `<strong>${escapeHtml(title)}</strong><br><span style="font-size:12px; opacity:0.8">${escapeHtml(msg)}</span>`;
            area.appendChild(t);
            setTimeout(() => t.remove(), 4000);
          }
        };

        // Event Delegation for Hints
        document.addEventListener("click", (e) => {
          // Sécurisation de la cible
          let target = e.target;
          if (target.nodeType === 3) target = target.parentNode;
          if (!target || !target.closest) return;

          // 1. Toggle Hints
          const toggle = target.closest("#btn-toggle-hints");
          if(toggle) {
            $("#mission-brief").classList.toggle("hidden");
            $("#hint-selector").classList.toggle("hidden");
            return;
          }

          // 2. Actions
          const actionEl = target.closest("[data-action]");
          if (!actionEl) return;

          const action = actionEl.dataset.action;
          const handlers = {
            'launch': () => Apps.launch(actionEl.dataset.app),
            'get-hint': () => Story.showHint(actionEl.dataset.level),
            'open-file': () => Apps.Explorer.handle(actionEl.dataset.id),
            'open-mail': () => Apps.Mail.view(actionEl.dataset.id),
            'unlock-chat': () => Apps.Chat.unlock(),
            'open-chat-contact': () => Apps.Chat.load(actionEl.dataset.id),
            'go': () => Apps.Browser.go(actionEl.dataset.route),
            'check-bank-login': () => Apps.Browser.askOTP(),
            'check-otp': () => Apps.Browser.checkOTP(),
            'do-transfer': () => Apps.Browser.doTransfer(),
            'scan-metadata': () => {
              const btn = actionEl;
              const targetId = btn.dataset.targetId;
              const metadata = btn.dataset.metadata;
              const metaContainer = $(`#scan-results-${targetId}`);

              if (!metaContainer) return;

              btn.textContent = "SCAN EN COURS...";
              btn.disabled = true;

              setTimeout(() => {
                  const newContent = metadata.split('\n').map(line => {
                      const [label, ...value] = line.split(':');
                      const isDate = label.toLowerCase().includes('date');
                      const valueStr = value.join(':').trim();
                      return `
                          <div class="p-meta-row">
                              <span class="p-meta-lbl" style="color:#888;">${escapeHtml(label)}</span>
                              <span style="${isDate ? 'color:#fbbf24; font-weight:bold;' : 'color:#fff;'}">${escapeHtml(valueStr)}</span>
                          </div>`;
                  }).join('');

                  metaContainer.innerHTML = newContent;
                  metaContainer.style.display = "block";
                  metaContainer.scrollIntoView({ behavior: "smooth" });
                  btn.textContent = "SCAN TERMINÉ";
              }, 1500);
            }
          };

          if (handlers[action]) handlers[action]();
        });

        // Init
        document.addEventListener("DOMContentLoaded", OS.boot);

      })();
    </script>
